# Keep the Render free instance warm so judges never hit a cold start (~30-60s).
# Runs on GitHub's infra every 10 minutes; GitHub cron is UTC. Manual trigger supported.
name: keep-warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sS -m 90 -o /dev/null -w "keep-warm: %{http_code} in %{time_total}s\n" https://scopegate.onrender.com/api/v1/health
