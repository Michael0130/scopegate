# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: scopegate
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: PAYPAL_CLIENT_ID       # PayPal Sandbox credentials only
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: LLM_API_KEY            # BigModel GLM Coding Plan key
        sync: false
      - key: LLM_BASE_URL
        value: https://open.bigmodel.cn/api/coding/paas/v4
      - key: LLM_MODEL
        value: glm-5.3-flash
      - key: LLM_TIMEOUT_MS
        value: "4000"
